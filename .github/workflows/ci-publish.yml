name: CI and Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Resolve prebuild target
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: prebuild-target
        shell: pwsh
        run: |
          $target = node -p "process.platform + '-' + process.arch"
          "target=$target" >> $env:GITHUB_OUTPUT

      - name: Stage prebuilt addon
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "prebuilds/${{ steps.prebuild-target.outputs.target }}"
          Copy-Item -Path "build/Release/NodeStorm.node" -Destination "prebuilds/${{ steps.prebuild-target.outputs.target }}/NodeStorm.node"

      - name: Upload prebuilt addon
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ steps.prebuild-target.outputs.target }}
          path: prebuilds/${{ steps.prebuild-target.outputs.target }}/NodeStorm.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag version v$tag_version does not match package.json version $package_version."
            exit 1
          fi

      - name: Check npm version
        id: npm-version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve npm dist tag
        id: npm-dist-tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$package_version" == *-* ]]; then
            prerelease="${package_version#*-}"
            echo "tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Download prebuilt addons
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: downloaded-prebuilds

      - name: Arrange prebuilt addons
        shell: bash
        run: |
          mkdir -p prebuilds
          for artifact_dir in downloaded-prebuilds/prebuild-*; do
            prebuild_name="${artifact_dir##*/prebuild-}"
            mkdir -p "prebuilds/$prebuild_name"
            cp "$artifact_dir/NodeStorm.node" "prebuilds/$prebuild_name/NodeStorm.node"
          done

      - name: Preview package
        if: steps.npm-version.outputs.published == 'false'
        run: npm pack --dry-run

      - name: Publish package
        if: steps.npm-version.outputs.published == 'false'
        run: npm publish --access public --tag "${{ steps.npm-dist-tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Sync npm dist tags
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          dist_tag="${{ steps.npm-dist-tag.outputs.tag }}"

          npm dist-tag add "$package_name@$package_version" "$dist_tag"

          if [ "$dist_tag" != "latest" ]; then
            current_latest="$(npm view "$package_name" dist-tags.latest 2>/dev/null || true)"
            if [[ "$current_latest" == *-* ]]; then
              npm dist-tag rm "$package_name" latest ||
                echo "npm registry refused to remove latest tag $current_latest; leaving it unchanged."
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
